  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - scikit-image
  - h5py
  - lifelines
  - pillow
  - matplotlib
  - seaborn
  - pyyaml
  - tqdm
  - openslide
