  - pytorch
  - torchvision
  - pytorch-cuda=12.1
  - pip:
      - einops
      - captum
      - opencv-python
      - pytorch-lightning
      - scikit-survival
      - tensorboardX
      - tifffile
      - timm
      - torch-geometric
      - torchmetrics
